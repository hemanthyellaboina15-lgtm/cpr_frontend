server.port=0

# In-memory H2 Database with PostgreSQL compatibility for automated tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# File Upload Settings for Tests
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=./target/test-uploads

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Super Admin Test Defaults
app.admin.default-username=admin
app.admin.default-email=admin@campus.edu
app.admin.default-password=Admin@123

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
