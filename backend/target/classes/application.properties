server.port=${SERVER_PORT:8080}

# Database Configuration (PostgreSQL default, configurable via environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campus_problem_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Super Admin Bootstrap Configuration
app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@campus.edu}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123}

# Swagger / OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
